<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link rel="stylesheet" href="/static/style.css?v=8.0">
</head>
<body>
  <!-- Floating Corner Controls (No text-slapped buttons) -->
  <div class="floating-controls">
    <!-- Animated SVG Sun/Moon Toggle -->
    <button
      type="button"
      class="theme-switch"
      id="theme-switch"
      aria-label="Toggle color theme"
      title="Toggle theme"
    >
      <span class="theme-switch-track">
        <span class="theme-switch-thumb">
          <svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <mask id="moon-mask">
              <rect x="0" y="0" width="100%" height="100%" fill="white" />
              <circle class="moon-cutout" cx="17" cy="7" r="6" fill="black" />
            </mask>
            <circle class="sun-core" cx="12" cy="12" r="5" fill="currentColor" mask="url(#moon-mask)" />
            <g class="sun-rays">
              <line x1="12" y1="1.5" x2="12" y2="3.5" />
              <line x1="12" y1="20.5" x2="12" y2="22.5" />
              <line x1="4.57" y1="4.57" x2="5.98" y2="5.98" />
              <line x1="18.02" y1="18.02" x2="19.43" y2="19.43" />
              <line x1="1.5" y1="12" x2="3.5" y2="12" />
              <line x1="20.5" y1="12" x2="22.5" y2="12" />
              <line x1="4.57" y1="19.43" x2="5.98" y2="18.02" />
              <line x1="18.02" y1="5.98" x2="19.43" y2="4.57" />
            </g>
          </svg>
        </span>
      </span>
    </button>

    <!-- Icon-only Admin/Studio Trigger -->
    <button
      type="button"
      class="icon-trigger"
      id="admin-trigger"
      aria-label="Open studio controls (Shift+A)"
      title="Studio (Shift+A)"
    >
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="4" y1="21" x2="4" y2="14"></line>
        <line x1="4" y1="10" x2="4" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12" y2="3"></line>
        <line x1="20" y1="21" x2="20" y2="16"></line>
        <line x1="20" y1="12" x2="20" y2="3"></line>
        <line x1="1" y1="14" x2="7" y2="14"></line>
        <line x1="9" y1="8" x2="15" y2="8"></line>
        <line x1="17" y1="16" x2="23" y2="16"></line>
      </svg>
      <span class="token-dot" id="token-dot" hidden></span>
    </button>
  </div>

  <!-- Kinetic TextRoll Navigation Stage -->
  <header class="kinetic-stage">
    <ul class="kinetic-nav" id="kinetic-nav" role="tablist" aria-label="Portfolio sections">
      <li class="kinetic-nav-item">
        <button type="button" class="kinetic-nav-btn is-active" data-filter="all" role="tab" aria-selected="true">
          <span class="kinetic-idx">00</span>
          <span class="js-text-roll kinetic-word" data-text="INDEX" data-center="true">INDEX</span>
          <span class="kinetic-count" id="count-all">0</span>
        </button>
      </li>
      <li class="kinetic-nav-item">
        <button type="button" class="kinetic-nav-btn" data-filter="videos" role="tab" aria-selected="false">
          <span class="kinetic-idx">01</span>
          <span class="js-text-roll kinetic-word" data-text="MOTION" data-center="true">MOTION</span>
          <span class="kinetic-count" id="count-videos">0</span>
        </button>
      </li>
      <li class="kinetic-nav-item">
        <button type="button" class="kinetic-nav-btn" data-filter="photos" role="tab" aria-selected="false">
          <span class="kinetic-idx">02</span>
          <span class="js-text-roll kinetic-word" data-text="STILLS" data-center="true">STILLS</span>
          <span class="kinetic-count" id="count-photos">0</span>
        </button>
      </li>
      <li class="kinetic-nav-item">
        <button type="button" class="kinetic-nav-btn" data-filter="poems" role="tab" aria-selected="false">
          <span class="kinetic-idx">03</span>
          <span class="js-text-roll kinetic-word" data-text="VERSE" data-center="true">VERSE</span>
          <span class="kinetic-count" id="count-poems">0</span>
        </button>
      </li>
    </ul>
  </header>

  <!-- Main Exhibition Canvas -->
  <main class="exhibition">
    <!-- 01 / Videos -->
    <section class="chapter" id="chapter-videos">
      <div class="chapter-rule">
        <span class="chapter-num">01</span>
        <span class="chapter-label">Videos</span>
      </div>
      <div class="motion-reel" id="reel-videos"></div>
    </section>

    <!-- 02 / Photos -->
    <section class="chapter" id="chapter-photos">
      <div class="chapter-rule">
        <span class="chapter-num">02</span>
        <span class="chapter-label">Photos</span>
      </div>
      <div class="stills-gallery" id="gallery-photos"></div>
    </section>

    <!-- 03 / Poems (Interactive Split Reader) -->
    <section class="chapter" id="chapter-poems">
      <div class="chapter-rule">
        <span class="chapter-num">03</span>
        <span class="chapter-label">Poems</span>
      </div>
      <div class="verse-stage" id="stage-poems">
        <ul class="verse-index" id="verse-index"></ul>
        <article class="verse-reader" id="verse-reader"></article>
      </div>
    </section>
  </main>

  <!-- Full-Viewport Lightbox -->
  <div class="lightbox" id="lightbox" hidden aria-hidden="true">
    <div class="lightbox-top">
      <div class="lightbox-counter" id="lb-counter">01 / 01</div>
      <div class="lightbox-caption-wrap">
        <span class="lightbox-title" id="lb-title"></span>
        <span class="lightbox-desc" id="lb-desc"></span>
      </div>
      <div class="lightbox-nav">
        <button type="button" class="icon-trigger" id="lb-prev" aria-label="Previous image">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <button type="button" class="icon-trigger" id="lb-next" aria-label="Next image">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
        <button type="button" class="icon-trigger" id="lb-close" aria-label="Close viewer">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
    </div>
    <div class="lightbox-canvas" id="lb-canvas"></div>
  </div>

  <!-- Studio Modal (Admin) -->
  <div class="studio-backdrop" id="studio-modal" hidden aria-hidden="true">
    <div class="studio-Sheet" role="dialog" aria-modal="true" aria-labelledby="studio-heading">
      <header class="studio-top">
        <span class="studio-title" id="studio-heading">STUDIO</span>
        <button type="button" class="icon-trigger" id="studio-close" aria-label="Close studio">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </header>

      <div class="studio-content">
        <!-- Auth Key -->
        <div class="auth-box">
          <div class="auth-input-wrap">
            <svg class="key-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
            </svg>
            <input type="password" id="admin-token" placeholder="X-Admin-Token" autocomplete="off">
            <button type="button" class="pill-action" id="save-token">
              <span class="js-text-roll" data-text="AUTH">AUTH</span>
            </button>
          </div>
          <span class="auth-indicator" id="auth-indicator">Locked</span>
        </div>

        <!-- Mode Switcher -->
        <div class="mode-tabs" role="tablist">
          <button type="button" class="mode-tab is-active" data-tab="media">
            <span class="js-text-roll" data-text="MEDIA">MEDIA</span>
          </button>
          <button type="button" class="mode-tab" data-tab="poem">
            <span class="js-text-roll" data-text="VERSE">VERSE</span>
          </button>
        </div>

        <!-- Media Upload Form -->
        <form id="upload-form" class="studio-form">
          <label class="dropzone" id="dropzone">
            <input type="file" id="upload-file" name="file" accept="image/*,video/*" required>
            <div class="dropzone-preview" id="dropzone-preview" hidden></div>
            <div class="dropzone-prompt" id="dropzone-prompt">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
              </svg>
              <span class="dropzone-main" id="dropzone-filename">Drop video or image here</span>
              <span class="dropzone-sub" id="dropzone-filesize">or click to browse local files</span>
            </div>
          </label>

          <div class="floating-field">
            <input type="text" id="upload-title" name="title" placeholder=" " required>
            <label for="upload-title">Title</label>
          </div>

          <div class="floating-field">
            <textarea id="upload-desc" name="description" rows="2" placeholder=" "></textarea>
            <label for="upload-desc">Caption / Context</label>
          </div>

          <div class="upload-meter" id="upload-meter" hidden>
            <div class="upload-meter-fill" id="upload-meter-fill"></div>
          </div>

          <div class="studio-footer">
            <span class="studio-feedback" id="upload-feedback"></span>
            <button type="submit" class="submit-roll-btn" id="upload-submit">
              <span class="js-text-roll" data-text="PUBLISH MEDIA" data-center="true">PUBLISH MEDIA</span>
            </button>
          </div>
        </form>

        <!-- Poem Form -->
        <form id="poem-form" class="studio-form" hidden>
          <div class="floating-field">
            <input type="text" id="poem-title" name="title" placeholder=" " required>
            <label for="poem-title">Poem Title</label>
          </div>

          <div class="floating-field">
            <textarea id="poem-content" name="content" rows="8" placeholder=" " required></textarea>
            <label for="poem-content">Stanzas</label>
          </div>

          <div class="studio-footer">
            <span class="studio-feedback" id="poem-feedback"></span>
            <button type="submit" class="submit-roll-btn" id="poem-submit">
              <span class="js-text-roll" data-text="PUBLISH VERSE" data-center="true">PUBLISH VERSE</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="/static/app.js?v=8.0"></script>
</body>
</html>
