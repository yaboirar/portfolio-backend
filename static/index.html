<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Index</title>
  <link rel="stylesheet" href="/static/style.css?v=4.0">
</head>
<body>
  <div class="layout">
    <nav class="rail">
      <ul class="nav-list">
        <li><button type="button" class="nav-link is-active" data-view="all">index</button></li>
        <li><button type="button" class="nav-link" data-view="videos">videos</button></li>
        <li><button type="button" class="nav-link" data-view="photos">photos</button></li>
        <li><button type="button" class="nav-link" data-view="poems">poems</button></li>
      </ul>

      <div class="rail-meta">
        <button type="button" class="nav-link" id="theme-toggle">light</button>
        <button type="button" class="nav-link" id="admin-toggle">admin</button>
      </div>
    </nav>

    <main class="canvas">
      <!-- Admin drawer (inline, hidden by default) -->
      <section id="admin-panel" class="admin-panel" hidden>
        <div class="admin-row">
          <input type="password" id="admin-token" placeholder="X-Admin-Token" autocomplete="off">
          <button type="button" id="save-token">save token</button>
          <button type="button" id="close-admin">close</button>
        </div>

        <div class="admin-forms">
          <form id="upload-form" class="plain-form">
            <div class="form-title">upload video / photo</div>
            <input type="file" id="upload-file" name="file" accept="image/*,video/*" required>
            <input type="text" id="upload-title" name="title" placeholder="title" required>
            <textarea id="upload-description" name="description" rows="2" placeholder="description (optional)"></textarea>
            <div class="form-foot">
              <span id="upload-status"></span>
              <button type="submit" id="upload-submit">upload</button>
            </div>
          </form>

          <form id="poem-form" class="plain-form">
            <div class="form-title">new poem</div>
            <input type="text" id="poem-title" name="title" placeholder="title" required>
            <textarea id="poem-content" name="content" rows="6" placeholder="text" required></textarea>
            <div class="form-foot">
              <span id="poem-status"></span>
              <button type="submit" id="poem-submit">publish</button>
            </div>
          </form>
        </div>
      </section>

      <!-- Videos -->
      <section id="view-videos" class="work-section">
        <div class="video-list" id="list-videos"></div>
      </section>

      <!-- Photos -->
      <section id="view-photos" class="work-section">
        <div class="photo-columns" id="list-photos"></div>
      </section>

      <!-- Poems -->
      <section id="view-poems" class="work-section">
        <div class="poem-column" id="list-poems"></div>
      </section>
    </main>
  </div>

  <!-- Fullscreen Lightbox -->
  <div id="lightbox" class="lightbox" hidden>
    <div class="lightbox-bar">
      <span id="lightbox-caption"></span>
      <div class="lightbox-controls">
        <button type="button" id="lightbox-prev">prev</button>
        <button type="button" id="lightbox-next">next</button>
        <button type="button" id="lightbox-close">close</button>
      </div>
    </div>
    <div class="lightbox-stage" id="lightbox-stage"></div>
  </div>

  <script src="/static/app.js?v=4.0"></script>
</body>
</html>
