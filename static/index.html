<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link rel="preload" href="/static/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/style.css?v=admin-auth-v1">
</head>
<body>
  <!-- Ambient Background Glow & ASCII Art Canvas -->
  <div class="ambient-stage" aria-hidden="true">
    <video
      class="ascii-art-bg"
      src="/static/ascii/bg.mp4"
      poster="/static/ascii/bg.webp"
      autoplay
      loop
      muted
      playsinline
      aria-hidden="true"
    ></video>
    <div class="ambient-scrim"></div>
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
  </div>

  <div class="app-frame">
    <!-- Floating Top Bar -->
    <header class="top-bar">
      <!-- Top-Left: Active Category Pill (Icons: Home, Videos, Photos, Poems) -->
      <nav class="nav-pill" id="nav-pill" aria-label="Categories">
        <button type="button" class="nav-item is-active" id="nav-current" data-filter="all" title="All (Home)" aria-label="All (Home)">
          <span class="nav-current-icons">
            <span class="nav-icon-slot nav-selected-icon" data-key="all">
              <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9.5L12 3l9 6.5V20a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9.5z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            </span>
            <span class="nav-icon-slot nav-all-icon" data-key="all" style="opacity: 0; transform: scale(0.7) translateY(40%);">
              <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9.5L12 3l9 6.5V20a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9.5z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            </span>
          </span>
        </button>

        <div class="nav-drawer" id="nav-drawer">
          <span class="nav-divider"></span>
          <div class="nav-drawer-list" id="nav-drawer-list">
            <button type="button" class="nav-item" data-filter="media" title="Media" aria-label="Media">
              <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><polygon points="10 8 16 11 10 14 10 8"/><line x1="2" y1="21" x2="22" y2="21"/></svg>
            </button>
            <button type="button" class="nav-item" data-filter="poems" title="Poems" aria-label="Poems">
              <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="13" y2="13"/></svg>
            </button>
          </div>
        </div>
      </nav>

      <!-- Center: Glassmorphic Pop & Resize Search Bar (No arrow, no black circle) -->
      <div class="search-hub" id="search-hub">
        <div class="search-pill" id="search-pill">
          <span class="search-tile" aria-hidden="true">
            <svg class="search-tile-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7"></circle>
              <line x1="20" y1="20" x2="16.2" y2="16.2"></line>
            </svg>
            <svg class="search-ring-svg" viewBox="0 0 28 28">
              <circle class="search-ring-track" cx="14" cy="14" r="12.5" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
              <circle class="search-ring-fill" id="search-ring-fill" cx="14" cy="14" r="12.5" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
            </svg>
          </span>

          <input
            type="search"
            class="search-input"
            id="search-input"
            placeholder="Search..."
            autocomplete="off"
            spellcheck="false"
            aria-label="Search uploaded items"
            data-i18n-placeholder="searchPlaceholder"
            data-i18n-aria="searchAria"
          >

          <!-- Stacked Match Badges -->
          <span class="search-stack" id="search-stack" hidden></span>

          <!-- Match Count -->
          <span class="search-count" id="search-count" hidden>0</span>

          <!-- Clear Button (Only visible when text is typed) -->
          <button type="button" class="search-clear" id="search-clear" hidden aria-label="Clear search" data-i18n-aria="clearSearch">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
      </div>

      <!-- Top-Right: Floating Controls -->
      <div class="control-pill">
        <!-- Animated Sun / Moon Switch -->
        <button
          type="button"
          class="theme-toggle"
          id="theme-toggle"
          aria-label="Toggle theme"
        >
          <span class="theme-track">
            <span class="theme-thumb">
              <svg class="theme-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <mask id="moon-mask">
                  <rect x="0" y="0" width="100%" height="100%" fill="white" />
                  <circle class="moon-cut" cx="17" cy="7" r="6" fill="black" />
                </mask>
                <circle class="sun-body" cx="12" cy="12" r="5" fill="currentColor" mask="url(#moon-mask)" />
                <g class="sun-rays">
                  <line x1="12" y1="1.5" x2="12" y2="3.5" />
                  <line x1="12" y1="20.5" x2="12" y2="22.5" />
                  <line x1="4.57" y1="4.57" x2="5.98" y2="5.98" />
                  <line x1="18.02" y1="18.02" x2="19.43" y2="19.43" />
                  <line x1="1.5" y1="12" x2="3.5" y2="12" />
                  <line x1="20.5" y1="12" x2="22.5" y2="12" />
                  <line x1="4.57" y1="19.43" x2="5.98" y2="18.02" />
                  <line x1="18.02" y1="5.98" x2="19.43" y2="4.57" />
                </g>
              </svg>
            </span>
          </span>
        </button>

        <span class="pill-sep"></span>

        <!-- Slide-In Upload Panel Toggle (Icon) -->
        <button
          type="button"
          class="upload-toggle"
          id="upload-toggle"
          aria-expanded="false"
          title="Upload media & poems"
          aria-label="Upload media & poems"
        >
          <svg class="upload-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
        </button>

        <span class="pill-sep"></span>

        <!-- Dedicated Admin Account / Login Button -->
        <button
          type="button"
          class="admin-toggle"
          id="admin-toggle"
          aria-expanded="false"
          title="Admin account & login"
          aria-label="Admin account & login"
        >
          <span class="auth-indicator" id="auth-indicator" hidden></span>
          <svg class="admin-svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Dockable Bento Workspace -->
    <div class="bento-workspace" id="bento-workspace">
      <main class="bento-stage" id="bento-stage">
        <!-- Left Primary Slot -->
        <div class="bento-slot slot-primary" id="slot-primary">
          <section class="bento-panel" id="panel-media" data-panel="media" draggable="true">
            <header class="panel-header" title="Drag header to swap panel position">
              <div class="panel-title-wrap">
                <span class="drag-dots" aria-hidden="true">⋮⋮</span>
                <span class="js-text-roll panel-heading" id="heading-media" data-i18n="media" data-text="Media">Media</span>
              </div>
              <div class="panel-header-actions">
                <div class="panel-toolbar" role="toolbar" aria-label="Media controls">
                  <div class="panel-search-hub" id="panel-search-hub-media">
                    <div class="panel-search-pill" id="panel-search-pill-media">
                      <button type="button" class="panel-search-icon-btn" data-panel="media" title="Search media" aria-label="Search media">
                        <svg class="tool-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                          <circle cx="11" cy="11" r="7.5"></circle>
                          <line x1="21" y1="21" x2="16.5" y2="16.5"></line>
                        </svg>
                      </button>
                      <input
                        type="search"
                        class="panel-search-input"
                        id="search-input-media"
                        data-panel="media"
                        placeholder="Search..."
                        autocomplete="off"
                        spellcheck="false"
                        aria-label="Search media"
                      >
                      <button type="button" class="panel-search-clear" id="search-clear-media" data-panel="media" title="Clear search" aria-label="Clear search" hidden>
                        <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                      </button>
                    </div>
                  </div>
                  <button type="button" class="panel-tool-btn panel-filter-btn" data-panel="media" title="Filter media" aria-label="Filter media" aria-haspopup="true" aria-expanded="false">
                    <svg class="tool-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                    </svg>
                  </button>
                  <button type="button" class="panel-tool-btn panel-sort-btn" data-panel="media" title="Sort media" aria-label="Sort media" aria-haspopup="true" aria-expanded="false">
                    <svg class="tool-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="m3 16 4 4 4-4"></path>
                      <path d="M7 20V4"></path>
                      <path d="m21 8-4-4-4 4"></path>
                      <path d="M17 4v16"></path>
                    </svg>
                  </button>
                </div>
                <span class="panel-actions-divider" aria-hidden="true"></span>
                <button type="button" class="panel-expand-btn" data-expand="media" aria-label="Expand Media">
                  <svg class="icon-expand" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
                  <svg class="icon-collapse" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 14 10 14 10 20"></polyline><polyline points="20 10 14 10 14 4"></polyline><line x1="14" y1="10" x2="21" y2="3"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
                </button>
                <div class="panel-popover filter-popover" id="filter-popover-media" hidden role="menu" aria-label="Filter Media">
                  <div class="popover-header">Filter</div>
                  <button type="button" class="popover-item is-active" data-panel="media" data-type="filter" data-val="all" role="menuitem">
                    <span class="popover-check" aria-hidden="true">✓</span>
                    <span>All Media</span>
                  </button>
                  <button type="button" class="popover-item" data-panel="media" data-type="filter" data-val="videos" role="menuitem">
                    <span class="popover-check" aria-hidden="true">✓</span>
                    <span>Videos Only</span>
                  </button>
                  <button type="button" class="popover-item" data-panel="media" data-type="filter" data-val="photos" role="menuitem">
                    <span class="popover-check" aria-hidden="true">✓</span>
                    <span>Photos Only</span>
                  </button>
                  <button type="button" class="popover-item" data-panel="media" data-type="filter" data-val="recent" role="menuitem">
                    <span class="popover-check" aria-hidden="true">✓</span>
                    <span>Recent Uploads</span>
                  </button>
                  <button type="button" class="popover-item" data-panel="media" data-type="filter" data-val="has_desc" role="menuitem">
                    <span class="popover-check" aria-hidden="true">✓</span>
                    <span>With Description</span>
                  </button>
                </div>
                <div class="panel-popover sort-popover" id="sort-popover-media" hidden role="menu" aria-label="Sort Media">
                  <div class="popover-header">Sort By</div>
                  <button type="button" class="popover-item is-active" data-panel="media" data-type="sort" data-val="newest" role="menuitem">
                    <span class="popover-check" aria-hidden="true">✓</span>
                    <span>Newest First</span>
                  </button>
                  <button type="button" class="popover-item" data-panel="media" data-type="sort" data-val="oldest" role="menuitem">
                    <span class="popover-check" aria-hidden="true">✓</span>
                    <span>Oldest First</span>
                  </button>
                  <button type="button" class="popover-item" data-panel="media" data-type="sort" data-val="az" role="menuitem">
                    <span class="popover-check" aria-hidden="true">✓</span>
                    <span>Title (A–Z)</span>
                  </button>
                  <button type="button" class="popover-item" data-panel="media" data-type="sort" data-val="za" role="menuitem">
                    <span class="popover-check" aria-hidden="true">✓</span>
                    <span>Title (Z–A)</span>
                  </button>
                </div>
              </div>
            </header>
            <div class="panel-body" id="body-media"></div>
          </section>
        </div>

        <!-- Vertical Resize Gutter (Left Slot <-> Right Stack) -->
        <div class="gutter-v" id="gutter-main-v" title="Drag to resize panels (Double-click to reset)">
          <span class="gutter-pill"></span>
        </div>

        <!-- Right Secondary Slot -->
        <div class="bento-slot slot-secondary" id="slot-secondary">
          <section class="bento-panel" id="panel-poems" data-panel="poems" draggable="true">
            <header class="panel-header" title="Drag header to swap panel position">
              <div class="panel-title-wrap">
                <span class="drag-dots" aria-hidden="true">⋮⋮</span>
                <span class="js-text-roll panel-heading" id="heading-poems" data-i18n="poems" data-text="Poems">Poems</span>
              </div>
              <div class="panel-header-actions">
                <div class="panel-toolbar" role="toolbar" aria-label="Poems controls">
                  <div class="panel-search-hub" id="panel-search-hub-poems">
                    <div class="panel-search-pill" id="panel-search-pill-poems">
                      <button type="button" class="panel-search-icon-btn" data-panel="poems" title="Search poems" aria-label="Search poems">
                        <svg class="tool-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                          <circle cx="11" cy="11" r="7.5"></circle>
                          <line x1="21" y1="21" x2="16.5" y2="16.5"></line>
                        </svg>
                      </button>
                      <input
                        type="search"
                        class="panel-search-input"
                        id="search-input-poems"
                        data-panel="poems"
                        placeholder="Search..."
                        autocomplete="off"
                        spellcheck="false"
                        aria-label="Search poems"
                      >
                      <button type="button" class="panel-search-clear" id="search-clear-poems" data-panel="poems" title="Clear search" aria-label="Clear search" hidden>
                        <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                      </button>
                    </div>
                  </div>
                  <button type="button" class="panel-tool-btn panel-filter-btn" data-panel="poems" title="Filter poems" aria-label="Filter poems" aria-haspopup="true" aria-expanded="false">
                    <svg class="tool-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                    </svg>
                  </button>
                  <button type="button" class="panel-tool-btn panel-sort-btn" data-panel="poems" title="Sort poems" aria-label="Sort poems" aria-haspopup="true" aria-expanded="false">
                    <svg class="tool-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="m3 16 4 4 4-4"></path>
                      <path d="M7 20V4"></path>
                      <path d="m21 8-4-4-4 4"></path>
                      <path d="M17 4v16"></path>
                    </svg>
                  </button>
                </div>
                <span class="panel-actions-divider" aria-hidden="true"></span>
                <button type="button" class="panel-expand-btn" data-expand="poems" aria-label="Expand Poems">
                  <svg class="icon-expand" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
                  <svg class="icon-collapse" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 14 10 14 10 20"></polyline><polyline points="20 10 14 10 14 4"></polyline><line x1="14" y1="10" x2="21" y2="3"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
                </button>
                <div class="panel-popover filter-popover" id="filter-popover-poems" hidden role="menu" aria-label="Filter Poems">
                  <div class="popover-header">Filter</div>
                  <button type="button" class="popover-item is-active" data-panel="poems" data-type="filter" data-val="all" role="menuitem">
                    <span class="popover-check" aria-hidden="true">✓</span>
                    <span>All Poems</span>
                  </button>
                  <button type="button" class="popover-item" data-panel="poems" data-type="filter" data-val="short" role="menuitem">
                    <span class="popover-check" aria-hidden="true">✓</span>
                    <span>Short (&lt; 6 lines)</span>
                  </button>
                  <button type="button" class="popover-item" data-panel="poems" data-type="filter" data-val="long" role="menuitem">
                    <span class="popover-check" aria-hidden="true">✓</span>
                    <span>Long (6+ lines)</span>
                  </button>
                </div>
                <div class="panel-popover sort-popover" id="sort-popover-poems" hidden role="menu" aria-label="Sort Poems">
                  <div class="popover-header">Sort By</div>
                  <button type="button" class="popover-item is-active" data-panel="poems" data-type="sort" data-val="newest" role="menuitem">
                    <span class="popover-check" aria-hidden="true">✓</span>
                    <span>Newest First</span>
                  </button>
                  <button type="button" class="popover-item" data-panel="poems" data-type="sort" data-val="oldest" role="menuitem">
                    <span class="popover-check" aria-hidden="true">✓</span>
                    <span>Oldest First</span>
                  </button>
                  <button type="button" class="popover-item" data-panel="poems" data-type="sort" data-val="az" role="menuitem">
                    <span class="popover-check" aria-hidden="true">✓</span>
                    <span>Title (A–Z)</span>
                  </button>
                  <button type="button" class="popover-item" data-panel="poems" data-type="sort" data-val="za" role="menuitem">
                    <span class="popover-check" aria-hidden="true">✓</span>
                    <span>Title (Z–A)</span>
                  </button>
                </div>
              </div>
            </header>
            <div class="panel-body poems-body" id="body-poems"></div>
          </section>
        </div>
      </main>

      <!-- Vertical Gutter for Slide-In Upload Panel -->
      <div class="gutter-v" id="gutter-upload" hidden title="Drag to resize Upload panel">
        <span class="gutter-pill"></span>
      </div>

      <!-- Slide-Left Push Upload Panel -->
      <aside class="upload-dock" id="upload-dock" aria-hidden="true">
        <div class="bento-panel upload-panel-surface">
          <header class="panel-header upload-header">
            <div class="upload-tabs" role="tablist">
              <button type="button" class="upload-tab is-active" id="tab-media" data-mode="media">
                <span class="js-text-roll" id="text-tab-media" data-i18n="media" data-text="Media">Media</span>
              </button>
              <button type="button" class="upload-tab" id="tab-poem" data-mode="poem">
                <span class="js-text-roll" id="text-tab-poem" data-i18n="poems" data-text="Poems">Poems</span>
              </button>
            </div>
            <button type="button" class="panel-expand-btn" id="upload-close" aria-label="Close upload panel" data-i18n-aria="closeUpload">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </header>

          <div class="upload-scroll">
            <!-- Subtle Auth Warning in Upload Drawer when Logged Out -->
            <div class="upload-auth-banner" id="upload-auth-banner" hidden>
              <div class="upload-auth-banner-content">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <span>Admin access required to publish</span>
              </div>
              <button type="button" class="auth-banner-btn" id="btn-banner-auth">Sign In / Register</button>
            </div>

            <form id="upload-form" class="upload-form">
              <div class="drop-surface" id="drop-surface">
                <input type="file" id="upload-file" name="file" accept="image/*,video/*" required>
                <div class="drop-preview" id="drop-preview" hidden></div>
                <div class="drop-empty" id="drop-empty">
                  <div class="drop-icon-ring">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M12 19V5" />
                      <polyline points="5 12 12 5 19 12" />
                    </svg>
                  </div>
                  <span class="drop-title" id="drop-title" data-i18n="dropTitle">Drop or select a video or photo</span>
                  <span class="drop-hint" id="drop-hint" data-i18n="dropHint">Drag bottom handle below to resize</span>
                </div>
              </div>

              <div class="gutter-h drop-resizer" id="gutter-drop" title="Drag up/down to resize preview area">
                <span class="gutter-pill"></span>
              </div>

              <div class="form-fields">
                <input type="text" class="sleek-input" id="upload-title" name="title" placeholder="Title" data-i18n-placeholder="title" required>
                <textarea class="sleek-input" id="upload-desc" name="description" rows="3" placeholder="Description (optional)" data-i18n-placeholder="description"></textarea>

                <div class="progress-track" id="upload-meter" hidden>
                  <div class="progress-bar" id="upload-meter-fill"></div>
                </div>

                <div class="submit-row">
                  <span class="feedback-label" id="upload-status"></span>
                  <button type="submit" class="primary-action-btn" id="upload-submit">
                    <span class="js-text-roll" id="text-upload-submit" data-i18n="upload" data-text="Upload" data-center="true">Upload</span>
                  </button>
                </div>
              </div>
            </form>

            <form id="poem-form" class="upload-form" hidden>
              <div class="form-fields">
                <input type="text" class="sleek-input" id="poem-title" name="title" placeholder="Title" data-i18n-placeholder="title" required>
                <textarea class="sleek-input poem-textarea" id="poem-content" name="content" rows="10" placeholder="Write poem..." data-i18n-placeholder="writePoem" required></textarea>

                <div class="submit-row">
                  <span class="feedback-label" id="poem-status"></span>
                  <button type="submit" class="primary-action-btn" id="poem-submit">
                    <span class="js-text-roll" id="text-poem-submit" data-i18n="upload" data-text="Upload" data-center="true">Upload</span>
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </aside>
    </div>

    <!-- Bottom Footer: Pop-up Upload Progress Bar (ProgressBar component) -->
    <footer class="app-footer" id="app-footer">
      <div class="footer-upload-hub" id="footer-upload-hub">
        <div
          class="footer-progress-widget"
          id="footer-progress-widget"
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-label="Upload progress"
          aria-hidden="true"
        >
          <div class="footer-progress-top">
            <span class="footer-progress-label-wrap">
              <svg class="footer-upload-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
              </svg>
              <span class="footer-progress-title truncate" id="footer-progress-title"></span>
            </span>

            <span class="footer-progress-status-grid" aria-hidden="true">
              <span class="footer-progress-pending" id="footer-progress-pending">Working</span>
              <span class="footer-progress-percent" id="footer-progress-percent">0%</span>
            </span>
          </div>

          <div class="footer-progress-track">
            <div class="footer-progress-slot">
              <span class="footer-progress-fill" id="footer-progress-fill"></span>
              <span class="footer-progress-scan" id="footer-progress-scan"></span>
            </div>
          </div>
        </div>
      </div>
    </footer>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" hidden aria-hidden="true">
    <header class="lightbox-top">
      <div class="lightbox-meta">
        <span class="lightbox-title" id="lb-title"></span>
        <span class="lightbox-desc" id="lb-desc"></span>
      </div>
      <div class="lightbox-actions">
        <button type="button" class="pill-btn" id="lb-prev">
          <span class="js-text-roll" id="text-lb-prev" data-i18n="prev" data-text="Prev">Prev</span>
        </button>
        <button type="button" class="pill-btn" id="lb-next">
          <span class="js-text-roll" id="text-lb-next" data-i18n="next" data-text="Next">Next</span>
        </button>
        <button type="button" class="pill-btn" id="lb-close">
          <span class="js-text-roll" id="text-lb-close" data-i18n="close" data-text="Close">Close</span>
        </button>
      </div>
    </header>
    <div class="lightbox-canvas" id="lb-canvas"></div>
  </div>

  <!-- Dedicated Admin Authentication Modal -->
  <div class="admin-modal" id="admin-modal" hidden aria-hidden="true">
    <div class="admin-modal-backdrop" id="admin-modal-backdrop"></div>
    <div class="admin-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="admin-modal-title">
      <header class="admin-modal-header">
        <div class="admin-modal-title-wrap">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span class="admin-modal-title" id="admin-modal-title">Admin Account</span>
        </div>
        <button type="button" class="panel-expand-btn" id="admin-modal-close" aria-label="Close admin modal">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </header>

      <div class="admin-modal-body">
        <!-- Logged-in State Banner -->
        <div class="auth-logged-in" id="auth-logged-in" hidden>
          <div class="auth-user-info">
            <span class="auth-status-dot"></span>
            <span class="auth-welcome">Logged in as: <strong id="auth-current-user">User</strong></span>
          </div>
          <div class="auth-user-actions">
            <button type="button" class="pill-btn auth-small-btn" id="auth-add-btn" title="Add another admin">
              <span>+ Add Admin</span>
            </button>
            <button type="button" class="pill-btn auth-small-btn auth-logout-danger" id="auth-logout-btn">
              <span>Log Out</span>
            </button>
          </div>
        </div>

        <!-- Logged-out Auth Container -->
        <div class="auth-logged-out" id="auth-logged-out">
          <div class="auth-tabs" id="auth-tabs" role="tablist">
            <button type="button" class="auth-tab is-active" id="tab-auth-login" data-auth-tab="login">
              <span>Sign In</span>
            </button>
            <button type="button" class="auth-tab" id="tab-auth-register" data-auth-tab="register">
              <span id="tab-register-text">Create Admin</span>
            </button>
          </div>

          <!-- Alert Message -->
          <div class="auth-alert" id="auth-alert" hidden></div>

          <!-- Login Form -->
          <form id="form-auth-login" class="auth-subform">
            <div class="auth-field-group">
              <input type="text" class="sleek-input auth-input" id="login-username" placeholder="Username" autocomplete="username" required>
              <input type="password" class="sleek-input auth-input" id="login-password" placeholder="Password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="primary-action-btn auth-submit-btn" id="btn-login-submit">
              <span>Sign In</span>
            </button>
          </form>

          <!-- Register Form -->
          <form id="form-auth-register" class="auth-subform" hidden>
            <div class="auth-notice" id="auth-register-notice">Create primary administrator account</div>
            <div class="auth-field-group">
              <input type="text" class="sleek-input auth-input" id="reg-username" placeholder="Username (letters, numbers, _)" autocomplete="username" required>
              <input type="password" class="sleek-input auth-input" id="reg-password" placeholder="Password (min. 6 chars)" autocomplete="new-password" required>
              <input type="password" class="sleek-input auth-input" id="reg-confirm" placeholder="Confirm password" autocomplete="new-password" required>
              <input type="password" class="sleek-input auth-input" id="reg-setup-key" placeholder="Master Setup Key (from .admin_token)" autocomplete="off">
            </div>
            <button type="submit" class="primary-action-btn auth-submit-btn" id="btn-register-submit">
              <span id="btn-register-text">Create Admin Account</span>
            </button>
          </form>

          <!-- Token Fallback Accordion -->
          <div class="auth-token-fallback">
            <button type="button" class="auth-token-toggle" id="auth-token-toggle">
              <span>Or use master token</span>
              <svg class="chevron-svg" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
            <div class="token-pill" id="token-pill-container" hidden>
              <input type="password" id="admin-token" placeholder="Admin token" data-i18n-placeholder="adminToken" autocomplete="off">
              <button type="button" class="pill-btn" id="save-token">
                <span class="js-text-roll" id="text-save-token" data-i18n="save" data-text="Save">Save</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/hls.min.js"></script>
  <script src="/static/app.js?v=admin-auth-v2"></script>
</body>
</html>
