<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link rel="stylesheet" href="/static/style.css?v=15.0">
</head>
<body>
  <!-- Ambient Background Glow -->
  <div class="ambient-stage" aria-hidden="true">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
  </div>

  <div class="app-frame">
    <!-- Floating Top Bar -->
    <header class="top-bar">
      <!-- Hover-Slide TextRoll Pill -->
      <nav class="nav-pill" id="nav-pill" aria-label="Categories">
        <button type="button" class="nav-item is-active" data-filter="all">
          <span class="js-text-roll nav-roll" data-text="ALL" data-center="true">ALL</span>
        </button>

        <div class="nav-drawer" id="nav-drawer">
          <span class="nav-divider"></span>
          <button type="button" class="nav-item" data-filter="videos">
            <span class="js-text-roll nav-roll" data-text="VIDEOS" data-center="true">VIDEOS</span>
          </button>
          <button type="button" class="nav-item" data-filter="photos">
            <span class="js-text-roll nav-roll" data-text="PHOTOS" data-center="true">PHOTOS</span>
          </button>
          <button type="button" class="nav-item" data-filter="poems">
            <span class="js-text-roll nav-roll" data-text="POEMS" data-center="true">POEMS</span>
          </button>
        </div>
      </nav>

      <!-- WebSearch Pill & Dropdown (21st.dev inspired) -->
      <div class="web-search" id="web-search">
        <div class="web-search-trigger" id="web-search-trigger" role="combobox" aria-expanded="false" aria-haspopup="listbox">
          <!-- Globe Tile with Animated Fill Ring -->
          <span class="globe-tile" id="search-globe-tile">
            <svg class="globe-svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="9" />
              <path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z" />
            </svg>
            <svg class="globe-ring-svg" viewBox="0 0 28 28" aria-hidden="true">
              <circle class="ring-bg" cx="14" cy="14" r="13" />
              <circle class="ring-fill" id="search-ring-fill" cx="14" cy="14" r="13" />
            </svg>
          </span>

          <!-- Search Input -->
          <div class="search-label-wrap">
            <input
              type="text"
              id="search-input"
              class="search-input"
              placeholder="Search portfolio..."
              aria-label="Search portfolio"
              autocomplete="off"
              spellcheck="false"
            />
          </div>

          <!-- Matching Category Badges Stack (Fanned out on hover) -->
          <span class="favicon-stack" id="search-badge-stack" aria-label="Matching categories"></span>

          <!-- Chevron Expand / Collapse Indicator -->
          <button type="button" class="search-chevron" id="search-chevron" aria-label="Toggle search results">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
        </div>

        <!-- Floating Collapsible Dropdown -->
        <div class="search-dropdown" id="search-dropdown" hidden aria-hidden="true">
          <div class="search-dropdown-inner">
            <div class="search-header-row">
              <span class="search-status-text" id="search-status-text">0 items found</span>
              <span class="search-hint">Press Esc to exit &bull; / to focus</span>
            </div>
            <ol class="search-grid" id="search-grid"></ol>
          </div>
        </div>
      </div>

      <!-- Right Floating Controls -->
      <div class="control-pill">
        <!-- Animated Sun / Moon Switch -->
        <button
          type="button"
          class="theme-toggle"
          id="theme-toggle"
          aria-label="Toggle theme"
        >
          <span class="theme-track">
            <span class="theme-thumb">
              <svg class="theme-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <mask id="moon-mask">
                  <rect x="0" y="0" width="100%" height="100%" fill="white" />
                  <circle class="moon-cut" cx="17" cy="7" r="6" fill="black" />
                </mask>
                <circle class="sun-body" cx="12" cy="12" r="5" fill="currentColor" mask="url(#moon-mask)" />
                <g class="sun-rays">
                  <line x1="12" y1="1.5" x2="12" y2="3.5" />
                  <line x1="12" y1="20.5" x2="12" y2="22.5" />
                  <line x1="4.57" y1="4.57" x2="5.98" y2="5.98" />
                  <line x1="18.02" y1="18.02" x2="19.43" y2="19.43" />
                  <line x1="1.5" y1="12" x2="3.5" y2="12" />
                  <line x1="20.5" y1="12" x2="22.5" y2="12" />
                  <line x1="4.57" y1="19.43" x2="5.98" y2="18.02" />
                  <line x1="18.02" y1="5.98" x2="19.43" y2="4.57" />
                </g>
              </svg>
            </span>
          </span>
        </button>

        <span class="pill-sep"></span>

        <!-- Slide-In Upload Panel Toggle -->
        <button
          type="button"
          class="upload-toggle"
          id="upload-toggle"
          aria-expanded="false"
        >
          <span class="auth-indicator" id="auth-indicator" hidden></span>
          <span class="js-text-roll upload-roll" data-text="UPLOAD" data-center="true">UPLOAD</span>
        </button>
      </div>
    </header>

    <!-- Main Dockable Bento Workspace -->
    <div class="bento-workspace" id="bento-workspace">
      <main class="bento-stage" id="bento-stage">
        <!-- Left Primary Slot -->
        <div class="bento-slot slot-primary" id="slot-primary" style="flex-basis: 54%;">
          <section class="bento-panel" id="panel-videos" data-panel="videos" draggable="true">
            <header class="panel-header" title="Drag header to swap panel position">
              <div class="panel-title-wrap">
                <span class="drag-dots" aria-hidden="true">⋮⋮</span>
                <span class="js-text-roll panel-heading" data-text="VIDEOS">VIDEOS</span>
              </div>
              <button type="button" class="panel-expand-btn" data-expand="videos" aria-label="Expand Videos">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
              </button>
            </header>
            <div class="panel-body" id="body-videos"></div>
          </section>
        </div>

        <!-- Vertical Resize Gutter (Left Slot <-> Right Stack) -->
        <div class="gutter-v" id="gutter-main-v" title="Drag to resize panels (Double-click to reset)">
          <span class="gutter-pill"></span>
        </div>

        <!-- Right Secondary Stack -->
        <div class="bento-stack" id="slot-stack" style="flex-basis: 46%;">
          <!-- Top Right Slot -->
          <div class="bento-slot slot-top" id="slot-top" style="flex-basis: 52%;">
            <section class="bento-panel" id="panel-photos" data-panel="photos" draggable="true">
              <header class="panel-header" title="Drag header to swap panel position">
                <div class="panel-title-wrap">
                  <span class="drag-dots" aria-hidden="true">⋮⋮</span>
                  <span class="js-text-roll panel-heading" data-text="PHOTOS">PHOTOS</span>
                </div>
                <button type="button" class="panel-expand-btn" data-expand="photos" aria-label="Expand Photos">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
                </button>
              </header>
              <div class="panel-body" id="body-photos"></div>
            </section>
          </div>

          <!-- Horizontal Resize Gutter (Top Right <-> Bottom Right) -->
          <div class="gutter-h" id="gutter-stack-h" title="Drag to resize panels (Double-click to reset)">
            <span class="gutter-pill"></span>
          </div>

          <!-- Bottom Right Slot -->
          <div class="bento-slot slot-bottom" id="slot-bottom" style="flex-basis: 48%;">
            <section class="bento-panel" id="panel-poems" data-panel="poems" draggable="true">
              <header class="panel-header" title="Drag header to swap panel position">
                <div class="panel-title-wrap">
                  <span class="drag-dots" aria-hidden="true">⋮⋮</span>
                  <span class="js-text-roll panel-heading" data-text="POEMS">POEMS</span>
                </div>
                <button type="button" class="panel-expand-btn" data-expand="poems" aria-label="Expand Poems">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
                </button>
              </header>
              <div class="panel-body poems-body" id="body-poems"></div>
            </section>
          </div>
        </div>
      </main>

      <!-- Vertical Gutter for Slide-In Upload Panel -->
      <div class="gutter-v" id="gutter-upload" hidden title="Drag to resize Upload panel">
        <span class="gutter-pill"></span>
      </div>

      <!-- Slide-Left Push Upload Panel (Compresses main workspace, no dark overlay) -->
      <aside class="upload-dock" id="upload-dock" aria-hidden="true">
        <div class="bento-panel upload-panel-surface">
          <header class="panel-header upload-header">
            <div class="upload-tabs" role="tablist">
              <button type="button" class="upload-tab is-active" data-mode="media">
                <span class="js-text-roll" data-text="MEDIA">MEDIA</span>
              </button>
              <button type="button" class="upload-tab" data-mode="poem">
                <span class="js-text-roll" data-text="POEMS">POEMS</span>
              </button>
            </div>
            <button type="button" class="panel-expand-btn" id="upload-close" aria-label="Close upload panel">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </header>

          <div class="upload-scroll">
            <!-- Admin Token Pill -->
            <div class="token-pill">
              <input type="password" id="admin-token" placeholder="Admin token" autocomplete="off">
              <button type="button" class="pill-btn" id="save-token">
                <span class="js-text-roll" data-text="SAVE">SAVE</span>
              </button>
            </div>

            <!-- Media Upload Form -->
            <form id="upload-form" class="upload-form">
              <!-- Adjustable File Drop & Preview Surface -->
              <div class="drop-surface" id="drop-surface">
                <input type="file" id="upload-file" name="file" accept="image/*,video/*" required>
                <div class="drop-preview" id="drop-preview" hidden></div>
                <div class="drop-empty" id="drop-empty">
                  <div class="drop-icon-ring">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M12 19V5" />
                      <polyline points="5 12 12 5 19 12" />
                    </svg>
                  </div>
                  <span class="drop-title" id="drop-title">Drop or select a video or photo</span>
                  <span class="drop-hint" id="drop-hint">Drag bottom handle below to resize</span>
                </div>
              </div>

              <!-- Horizontal Gutter to resize Drop Surface Height -->
              <div class="gutter-h drop-resizer" id="gutter-drop" title="Drag up/down to resize preview area">
                <span class="gutter-pill"></span>
              </div>

              <div class="form-fields">
                <input type="text" class="sleek-input" id="upload-title" name="title" placeholder="Title" required>
                <textarea class="sleek-input" id="upload-desc" name="description" rows="3" placeholder="Description (optional)"></textarea>

                <div class="progress-track" id="upload-meter" hidden>
                  <div class="progress-bar" id="upload-meter-fill"></div>
                </div>

                <div class="submit-row">
                  <span class="feedback-label" id="upload-status"></span>
                  <button type="submit" class="primary-action-btn" id="upload-submit">
                    <span class="js-text-roll" data-text="UPLOAD" data-center="true">UPLOAD</span>
                  </button>
                </div>
              </div>
            </form>

            <!-- Poem Upload Form -->
            <form id="poem-form" class="upload-form" hidden>
              <div class="form-fields">
                <input type="text" class="sleek-input" id="poem-title" name="title" placeholder="Title" required>
                <textarea class="sleek-input poem-textarea" id="poem-content" name="content" rows="10" placeholder="Write poem..." required></textarea>

                <div class="submit-row">
                  <span class="feedback-label" id="poem-status"></span>
                  <button type="submit" class="primary-action-btn" id="poem-submit">
                    <span class="js-text-roll" data-text="UPLOAD" data-center="true">UPLOAD</span>
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" hidden aria-hidden="true">
    <header class="lightbox-top">
      <div class="lightbox-meta">
        <span class="lightbox-title" id="lb-title"></span>
        <span class="lightbox-desc" id="lb-desc"></span>
      </div>
      <div class="lightbox-actions">
        <button type="button" class="pill-btn" id="lb-prev">
          <span class="js-text-roll" data-text="PREV">PREV</span>
        </button>
        <button type="button" class="pill-btn" id="lb-next">
          <span class="js-text-roll" data-text="NEXT">NEXT</span>
        </button>
        <button type="button" class="pill-btn" id="lb-close">
          <span class="js-text-roll" data-text="CLOSE">CLOSE</span>
        </button>
      </div>
    </header>
    <div class="lightbox-canvas" id="lb-canvas"></div>
  </div>

  <script src="/static/app.js?v=15.0"></script>
</body>
</html>
